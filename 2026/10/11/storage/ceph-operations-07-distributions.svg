<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">Ceph 的发行版与生态</tspan></text> <rect x="220" y="42" width="260" height="52" rx="6" fill="#16213e"></rect><text x="350" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff"><tspan leaf="">上游：ceph.io 社区</tspan></text> <text x="350" y="82" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">Ceph 基金会（2018）· LGPL 2.1 · 年度发布</tspan></text> <line x1="350" y1="94" x2="350" y2="118" stroke="#999" stroke-width="1.5"></line><line x1="110" y1="118" x2="590" y2="118" stroke="#999" stroke-width="1.5"></line><line x1="110" y1="118" x2="110" y2="138" stroke="#999" stroke-width="1.5"></line><line x1="270" y1="118" x2="270" y2="138" stroke="#999" stroke-width="1.5"></line><line x1="430" y1="118" x2="430" y2="138" stroke="#999" stroke-width="1.5"></line><line x1="590" y1="118" x2="590" y2="138" stroke="#999" stroke-width="1.5"></line><rect x="30" y="138" width="160" height="70" rx="4" fill="#0f3460"></rect><text x="110" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">IBM Storage Ceph</tspan></text> <text x="110" y="182" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">原 Red Hat Ceph</tspan></text> <text x="110" y="198" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">2022 年整合改名</tspan></text> <rect x="190" y="138" width="160" height="70" rx="4" fill="#764ba2"></rect><text x="270" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">OpenShift Data</tspan></text> <text x="270" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">Foundation</tspan></text> <text x="270" y="198" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">Red Hat · K8s 形态</tspan></text> <rect x="350" y="138" width="160" height="70" rx="4" fill="#27ae60"></rect><text x="430" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">Charmed Ceph</tspan></text> <text x="430" y="182" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">Canonical / Ubuntu</tspan></text> <text x="430" y="198" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">持续维护</tspan></text> <rect x="510" y="138" width="160" height="70" rx="4" fill="#667eea"></rect><text x="590" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">Rook</tspan></text> <text x="590" y="182" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">CNCF 毕业项目</tspan></text> <text x="590" y="198" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">K8s Operator 部署</tspan></text> <rect x="110" y="240" width="480" height="44" rx="4" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="350" y="259" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">国内：多家云厂商与存储厂商基于 Ceph 提供商业发行版与大规模部署</tspan></text> <text x="350" y="276" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">选型看三点：基于哪个上游版本、上游贡献记录、售后支持能力</tspan></text> <text x="350" y="312" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">已退场：SUSE Enterprise Storage（SES 6 支持 2022 年 1 月结束）</tspan></text> <text x="350" y="334" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">上游始终是唯一主干，发行版都是它的打包与支持服务</tspan></text></svg>