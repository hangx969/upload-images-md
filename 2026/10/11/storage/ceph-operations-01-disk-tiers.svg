<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">OSD 磁盘的三种常见配置</tspan></text> <rect x="20" y="42" width="210" height="200" rx="6" fill="#fff" stroke="#dee2e6"></rect><rect x="20" y="42" width="210" height="28" rx="6" fill="#0f3460"></rect><text x="125" y="61" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">混部：HDD 加 SSD</tspan></text> <rect x="35" y="84" width="26" height="70" rx="2" fill="#16213e"></rect><rect x="67" y="84" width="26" height="70" rx="2" fill="#16213e"></rect><rect x="99" y="84" width="26" height="70" rx="2" fill="#16213e"></rect><rect x="131" y="84" width="26" height="70" rx="2" fill="#16213e"></rect><rect x="163" y="84" width="26" height="70" rx="2" fill="#16213e"></rect><rect x="195" y="84" width="26" height="70" rx="2" fill="#27ae60"></rect><text x="120" y="175" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">深色：HDD 数据盘</tspan></text> <text x="120" y="193" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">绿色：SSD 放 db 与 wal</tspan></text> <text x="120" y="221" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">容量优先，成本最低</tspan></text> <rect x="245" y="42" width="210" height="200" rx="6" fill="#fff" stroke="#dee2e6"></rect><rect x="245" y="42" width="210" height="28" rx="6" fill="#667eea"></rect><text x="350" y="61" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">全闪：SSD 数据盘</tspan></text> <rect x="260" y="84" width="26" height="70" rx="2" fill="#667eea"></rect><rect x="292" y="84" width="26" height="70" rx="2" fill="#667eea"></rect><rect x="324" y="84" width="26" height="70" rx="2" fill="#667eea"></rect><rect x="356" y="84" width="26" height="70" rx="2" fill="#667eea"></rect><rect x="388" y="84" width="26" height="70" rx="2" fill="#667eea"></rect><rect x="420" y="84" width="26" height="70" rx="2" fill="#667eea"></rect><text x="350" y="175" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">数据与元数据都在 SSD</tspan></text> <text x="350" y="193" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">db 可再分给 NVMe</tspan></text> <text x="350" y="221" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">主流选择，性能均衡</tspan></text> <rect x="470" y="42" width="210" height="200" rx="6" fill="#fff" stroke="#dee2e6"></rect><rect x="470" y="42" width="210" height="28" rx="6" fill="#764ba2"></rect><text x="575" y="61" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">高性能：NVMe 全配</tspan></text> <rect x="485" y="84" width="26" height="70" rx="2" fill="#764ba2"></rect><rect x="517" y="84" width="26" height="70" rx="2" fill="#764ba2"></rect><rect x="549" y="84" width="26" height="70" rx="2" fill="#764ba2"></rect><rect x="581" y="84" width="26" height="70" rx="2" fill="#764ba2"></rect><rect x="613" y="84" width="26" height="70" rx="2" fill="#764ba2"></rect><rect x="645" y="84" width="26" height="70" rx="2" fill="#764ba2"></rect><text x="575" y="175" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">数据、db、wal 全在 NVMe</tspan></text> <text x="575" y="193" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">网络要 100GbE 跟上</tspan></text> <text x="575" y="221" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">低延迟场景，预算充足时</tspan></text> <text x="350" y="268" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">共同点：裸盘直通（HBA 直通或 JBOD），不做 RAID；SMR 盘三种配置都不要用</tspan></text></svg>