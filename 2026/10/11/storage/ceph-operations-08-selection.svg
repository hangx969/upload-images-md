<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">选型判断树</tspan></text> <rect x="230" y="42" width="240" height="38" rx="4" fill="#16213e"></rect><text x="350" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">需要块存储，给虚拟机供盘？</tspan></text> <line x1="290" y1="80" x2="200" y2="108" stroke="#999" stroke-width="1.5"></line><line x1="410" y1="80" x2="500" y2="108" stroke="#999" stroke-width="1.5"></line><text x="235" y="98" text-anchor="middle" font-size="10" fill="#555"><tspan leaf="">否</tspan></text> <text x="465" y="98" text-anchor="middle" font-size="10" fill="#555"><tspan leaf="">是</tspan></text> <rect x="60" y="108" width="240" height="38" rx="4" fill="#667eea"></rect><text x="180" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">对象或文件，只要一种形态？</tspan></text> <rect x="420" y="108" width="240" height="38" rx="4" fill="#0f3460"></rect><text x="540" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">规模几百 TB 起步？</tspan></text> <line x1="120" y1="146" x2="120" y2="176" stroke="#999" stroke-width="1.5"></line><polygon points="116,176 120,184 124,176" fill="#999"></polygon><line x1="240" y1="146" x2="240" y2="176" stroke="#999" stroke-width="1.5"></line><polygon points="236,176 240,184 244,176" fill="#999"></polygon><rect x="30" y="186" width="180" height="56" rx="4" fill="#27ae60"></rect><text x="120" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">对象：MinIO、SeaweedFS</tspan></text> <text x="120" y="226" text-anchor="middle" font-size="11" fill="#fff"><tspan leaf="">文件：MooseFS、JuiceFS</tspan></text> <rect x="150" y="186" width="180" height="56" rx="4" fill="#27ae60"></rect><text x="240" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">形态小、规模小，轻量优先</tspan></text> <line x1="540" y1="146" x2="540" y2="176" stroke="#999" stroke-width="1.5"></line><polygon points="536,176 540,184 544,176" fill="#999"></polygon><rect x="420" y="186" width="240" height="38" rx="4" fill="#764ba2"></rect><text x="540" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">有一名以上专职运维？</tspan></text> <line x1="480" y1="224" x2="420" y2="254" stroke="#999" stroke-width="1.5"></line><line x1="600" y1="224" x2="640" y2="254" stroke="#999" stroke-width="1.5"></line><text x="440" y="244" text-anchor="middle" font-size="10" fill="#555"><tspan leaf="">否</tspan></text> <text x="630" y="244" text-anchor="middle" font-size="10" fill="#555"><tspan leaf="">是</tspan></text> <rect x="300" y="256" width="220" height="56" rx="4" fill="#e94560"></rect><text x="410" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">买发行版支持服务</tspan></text> <text x="410" y="296" text-anchor="middle" font-size="11" fill="#fff"><tspan leaf="">或用云厂商托管存储</tspan></text> <rect x="540" y="256" width="160" height="56" rx="4" fill="#27ae60"></rect><text x="620" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff"><tspan leaf="">上 Ceph</tspan></text> <text x="350" y="346" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">四个问题按顺序问：块需求、多形态、规模、人力</tspan></text> <text x="350" y="368" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">任何一条答不上，都有比自建 Ceph 更合适的路</tspan></text></svg>