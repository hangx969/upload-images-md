<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">三副本与纠删码 4+2</tspan></text> <rect x="30" y="45" width="300" height="210" rx="6" fill="#fff" stroke="#dee2e6"></rect><text x="180" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f3460"><tspan leaf="">三副本：存三份完整的</tspan></text> <rect x="60" y="88" width="70" height="36" rx="3" fill="#667eea"></rect><text x="95" y="111" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">D</tspan></text> <rect x="145" y="88" width="70" height="36" rx="3" fill="#667eea"></rect><text x="180" y="111" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">D</tspan></text> <rect x="230" y="88" width="70" height="36" rx="3" fill="#667eea"></rect><text x="265" y="111" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">D</tspan></text> <text x="180" y="150" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">空间开销 ×3</tspan></text> <text x="180" y="172" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">任意随机写，延迟低</tspan></text> <text x="180" y="194" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">丢一份补一份，恢复快</tspan></text> <text x="180" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60"><tspan leaf="">适合 RBD、热数据</tspan></text> <rect x="370" y="45" width="300" height="210" rx="6" fill="#fff" stroke="#dee2e6"></rect><text x="520" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#764ba2"><tspan leaf="">纠删码 4+2：数据块加校验块</tspan></text> <rect x="385" y="88" width="42" height="36" rx="3" fill="#764ba2"></rect><text x="406" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">D1</tspan></text> <rect x="432" y="88" width="42" height="36" rx="3" fill="#764ba2"></rect><text x="453" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">D2</tspan></text> <rect x="479" y="88" width="42" height="36" rx="3" fill="#764ba2"></rect><text x="500" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">D3</tspan></text> <rect x="526" y="88" width="42" height="36" rx="3" fill="#764ba2"></rect><text x="547" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">D4</tspan></text> <rect x="573" y="88" width="42" height="36" rx="3" fill="#e94560"></rect><text x="594" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">C1</tspan></text> <rect x="620" y="88" width="42" height="36" rx="3" fill="#e94560"></rect><text x="641" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">C2</tspan></text> <text x="520" y="150" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">空间开销 ×1.5，任意坏两块可恢复</tspan></text> <text x="520" y="172" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">覆盖写要读改写，延迟高</tspan></text> <text x="520" y="194" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">恢复要凑条带重算，更慢</tspan></text> <text x="520" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60"><tspan leaf="">适合 RGW 冷数据、大对象</tspan></text> <text x="350" y="285" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">冗余策略建池时定，一个池只能选一种</tspan></text></svg>