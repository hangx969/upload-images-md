<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">一块盘掉线后的自愈时间线</tspan></text> <line x1="40" y1="150" x2="660" y2="150" stroke="#999" stroke-width="2"></line><polygon points="660,146 672,150 660,154" fill="#999"></polygon><circle cx="90" cy="150" r="6" fill="#e94560"></circle><circle cx="240" cy="150" r="6" fill="#e94560"></circle><circle cx="400" cy="150" r="6" fill="#667eea"></circle><circle cx="560" cy="150" r="6" fill="#27ae60"></circle><text x="90" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#e94560"><tspan leaf="">t0：OSD 掉线</tspan></text> <text x="90" y="100" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">心跳超时，标记 down</tspan></text> <text x="90" y="118" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">PG 进入 degraded</tspan></text> <text x="240" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#e94560"><tspan leaf="">t0+10 分钟：标记 out</tspan></text> <text x="240" y="205" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">默认 600 秒未归</tspan></text> <text x="240" y="223" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">开始重建数据</tspan></text> <text x="400" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#667eea"><tspan leaf="">重建中</tspan></text> <text x="400" y="100" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">有完整参照：recovery，快</tspan></text> <text x="400" y="118" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">无完整参照：backfill，慢</tspan></text> <text x="560" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60"><tspan leaf="">回到 active+clean</tspan></text> <text x="560" y="205" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">副本数补齐</tspan></text> <text x="560" y="223" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">故障闭环，全程自动</tspan></text> <text x="350" y="265" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">人要做的：确认告警、观察进度、判断坏盘要不要换</tspan></text> <text x="350" y="285" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">10 分钟内回来，原 OSD 归队，不用重建</tspan></text></svg>