<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">三类读者的读法</tspan></text> <rect x="20" y="45" width="110" height="44" rx="4" fill="#667eea"></rect><text x="75" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff"><tspan leaf="">初学者</tspan></text> <text x="150" y="63" font-size="12" fill="#333"><tspan leaf="">00 → 04 → 13 → 21 → 27</tspan></text> <text x="150" y="82" font-size="11" fill="#555"><tspan leaf="">先搞清楚几个代表项目是什么，再看选型</tspan></text> <rect x="20" y="105" width="110" height="44" rx="4" fill="#764ba2"></rect><text x="75" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff"><tspan leaf="">架构师</tspan></text> <text x="150" y="123" font-size="12" fill="#333"><tspan leaf="">07 / 08 → 21 / 22 → 24 → 27</tspan></text> <text x="150" y="142" font-size="11" fill="#555"><tspan leaf="">架构钻进去看取舍，新项目看设计动机</tspan></text> <rect x="20" y="165" width="110" height="44" rx="4" fill="#0f3460"></rect><text x="75" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">CTO 与产品</tspan></text> <text x="150" y="183" font-size="12" fill="#333"><tspan leaf="">13 → 22 → 27 → 28</tspan></text> <text x="150" y="202" font-size="11" fill="#555"><tspan leaf="">看治理与商业化的成败，再看选型和边界</tspan></text></svg>