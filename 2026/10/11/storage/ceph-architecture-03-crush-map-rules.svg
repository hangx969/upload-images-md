<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">CRUSH 的计算过程</tspan></text> <rect x="20" y="45" width="240" height="260" rx="6" fill="#fff" stroke="#dee2e6"></rect><text x="140" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#16213e"><tspan leaf="">输入一：集群地图（一棵树）</tspan></text> <rect x="95" y="82" width="90" height="24" rx="3" fill="#0f3460"></rect><text x="140" y="98" text-anchor="middle" font-size="11" fill="#fff"><tspan leaf="">root</tspan></text> <line x1="120" y1="106" x2="80" y2="124" stroke="#999" stroke-width="1.5"></line><line x1="160" y1="106" x2="200" y2="124" stroke="#999" stroke-width="1.5"></line><rect x="35" y="124" width="90" height="24" rx="3" fill="#667eea"></rect><text x="80" y="140" text-anchor="middle" font-size="11" fill="#fff"><tspan leaf="">机架 A</tspan></text> <rect x="155" y="124" width="90" height="24" rx="3" fill="#667eea"></rect><text x="200" y="140" text-anchor="middle" font-size="11" fill="#fff"><tspan leaf="">机架 B</tspan></text> <line x1="60" y1="148" x2="52" y2="166" stroke="#999" stroke-width="1.5"></line><line x1="100" y1="148" x2="108" y2="166" stroke="#999" stroke-width="1.5"></line><line x1="180" y1="148" x2="172" y2="166" stroke="#999" stroke-width="1.5"></line><line x1="220" y1="148" x2="228" y2="166" stroke="#999" stroke-width="1.5"></line><rect x="30" y="166" width="44" height="22" rx="3" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="52" y="181" text-anchor="middle" font-size="10" fill="#333"><tspan leaf="">主机 1</tspan></text> <rect x="86" y="166" width="44" height="22" rx="3" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="108" y="181" text-anchor="middle" font-size="10" fill="#333"><tspan leaf="">主机 2</tspan></text> <rect x="150" y="166" width="44" height="22" rx="3" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="172" y="181" text-anchor="middle" font-size="10" fill="#333"><tspan leaf="">主机 3</tspan></text> <rect x="206" y="166" width="44" height="22" rx="3" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="228" y="181" text-anchor="middle" font-size="10" fill="#333"><tspan leaf="">主机 4</tspan></text> <circle cx="40" cy="212" r="8" fill="#27ae60"></circle><circle cx="64" cy="212" r="8" fill="#27ae60"></circle><circle cx="96" cy="212" r="8" fill="#27ae60"></circle><circle cx="120" cy="212" r="8" fill="#27ae60"></circle><circle cx="160" cy="212" r="8" fill="#27ae60"></circle><circle cx="184" cy="212" r="8" fill="#27ae60"></circle><circle cx="216" cy="212" r="8" fill="#27ae60"></circle><circle cx="240" cy="212" r="8" fill="#27ae60"></circle><text x="140" y="245" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">叶子是 OSD（盘），节点带权重</tspan></text> <text x="140" y="263" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">权重和容量成正比</tspan></text> <text x="140" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f3460"><tspan leaf="">地图只有 MB 级，全员人手一份</tspan></text> <rect x="285" y="45" width="150" height="260" rx="6" fill="#fff" stroke="#dee2e6"></rect><text x="360" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#16213e"><tspan leaf="">输入二：规则与标识</tspan></text> <rect x="300" y="84" width="120" height="26" rx="3" fill="#764ba2"></rect><text x="360" y="101" text-anchor="middle" font-size="11" fill="#fff"><tspan leaf="">PG 编号 3.1a</tspan></text> <rect x="300" y="118" width="120" height="26" rx="3" fill="#764ba2"></rect><text x="360" y="135" text-anchor="middle" font-size="11" fill="#fff"><tspan leaf="">副本数 = 3</tspan></text> <rect x="300" y="152" width="120" height="26" rx="3" fill="#764ba2"></rect><text x="360" y="169" text-anchor="middle" font-size="11" fill="#fff"><tspan leaf="">故障域 = 主机</tspan></text> <rect x="300" y="200" width="120" height="56" rx="3" fill="#16213e"></rect><text x="360" y="222" text-anchor="middle" font-size="11" fill="#fff"><tspan leaf="">伪随机哈希</tspan></text> <text x="360" y="242" text-anchor="middle" font-size="11" fill="#fff"><tspan leaf="">沿树向下选叶子</tspan></text> <text x="360" y="285" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">输入相同，输出永远相同</tspan></text> <rect x="460" y="45" width="220" height="260" rx="6" fill="#fff" stroke="#dee2e6"></rect><text x="570" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#16213e"><tspan leaf="">输出：一组 OSD</tspan></text> <rect x="480" y="90" width="180" height="34" rx="3" fill="#27ae60"></rect><text x="570" y="111" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">osd.3（主 OSD）</tspan></text> <rect x="480" y="132" width="180" height="34" rx="3" fill="#0f3460"></rect><text x="570" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">osd.7</tspan></text> <rect x="480" y="174" width="180" height="34" rx="3" fill="#0f3460"></rect><text x="570" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">osd.14</tspan></text> <text x="570" y="235" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">三个 OSD 分属三台不同主机</tspan></text> <text x="570" y="253" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">由故障域规则保证</tspan></text> <text x="570" y="285" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f3460"><tspan leaf="">客户端和 OSD 各算一遍，答案一致</tspan></text> <line x1="260" y1="175" x2="283" y2="175" stroke="#999" stroke-width="1.5"></line><polygon points="283,171 291,175 283,179" fill="#999"></polygon><line x1="435" y1="175" x2="458" y2="175" stroke="#999" stroke-width="1.5"></line><polygon points="458,171 466,175 458,179" fill="#999"></polygon><text x="350" y="340" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">地图每次变化，版本号（epoch）加一，重算后只有受影响的数据换落点</tspan></text> <text x="350" y="362" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">加一块 10% 容量的盘，迁移的数据约等于总量的 10% 里原来没放对的部分</tspan></text> <text x="350" y="384" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">没有中心分配器，也就没有中心瓶颈</tspan></text></svg>