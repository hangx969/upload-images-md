<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">FileStore 与 BlueStore 的层次对比</tspan></text> <rect x="40" y="45" width="270" height="34" rx="4" fill="#16213e"></rect><text x="175" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">OSD 进程</tspan></text> <line x1="175" y1="79" x2="175" y2="93" stroke="#999" stroke-width="1.5"></line><polygon points="171,93 175,101 179,93" fill="#999"></polygon><rect x="40" y="103" width="270" height="34" rx="4" fill="#667eea"></rect><text x="175" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">FileStore（日志优先）</tspan></text> <line x1="175" y1="137" x2="175" y2="151" stroke="#999" stroke-width="1.5"></line><polygon points="171,151 175,159 179,151" fill="#999"></polygon><rect x="40" y="161" width="270" height="34" rx="4" fill="#e94560"></rect><text x="175" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">XFS 本地文件系统</tspan></text> <line x1="175" y1="195" x2="175" y2="209" stroke="#999" stroke-width="1.5"></line><polygon points="171,209 175,217 179,209" fill="#999"></polygon><rect x="40" y="219" width="270" height="34" rx="4" fill="#0f3460"></rect><text x="175" y="241" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">块设备（journal 另占一块 SSD）</tspan></text> <text x="175" y="278" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">数据写两遍，fsync 是瓶颈</tspan></text> <rect x="390" y="45" width="270" height="34" rx="4" fill="#16213e"></rect><text x="525" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">OSD 进程</tspan></text> <line x1="525" y1="79" x2="525" y2="93" stroke="#999" stroke-width="1.5"></line><polygon points="521,93 525,101 529,93" fill="#999"></polygon><rect x="390" y="103" width="270" height="56" rx="4" fill="#27ae60"></rect><text x="525" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">BlueStore（直接管理裸盘）</tspan></text> <text x="525" y="147" text-anchor="middle" font-size="11" fill="#fff"><tspan leaf="">元数据在内嵌 RocksDB，写时复制</tspan></text> <line x1="525" y1="159" x2="525" y2="209" stroke="#999" stroke-width="1.5"></line><polygon points="521,209 525,217 529,209" fill="#999"></polygon><rect x="390" y="219" width="270" height="34" rx="4" fill="#0f3460"></rect><text x="525" y="241" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">块设备（整盘直接交给 BlueStore）</tspan></text> <text x="525" y="278" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">少一层文件系统，少一遍写</tspan></text> <line x1="318" y1="160" x2="382" y2="160" stroke="#999" stroke-width="1.5"></line><polygon points="382,156 390,160 382,164" fill="#999"></polygon><text x="350" y="310" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">Luminous（2017）起 BlueStore 为默认，FileStore 已从新版本移除</tspan></text></svg>