<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif; visibility: visible;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">单机的三面墙</tspan></text> <rect x="30" y="50" width="200" height="26" rx="4" fill="#e94560" style="visibility: visible;"></rect><text x="130" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">容量墙</tspan></text> <rect x="30" y="76" width="200" height="84" rx="4" fill="#f8f9fa" stroke="#dee2e6" style="visibility: visible;"></rect><text x="130" y="108" text-anchor="middle" font-size="12" fill="#333" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">单块盘容量有上限</tspan></text> <text x="130" y="132" text-anchor="middle" font-size="12" fill="#333" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">单机盘位数也有上限</tspan></text> <rect x="250" y="50" width="200" height="26" rx="4" fill="#667eea" style="visibility: visible;"></rect><text x="350" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">性能墙</tspan></text> <rect x="250" y="76" width="200" height="84" rx="4" fill="#f8f9fa" stroke="#dee2e6" style="visibility: visible;"></rect><text x="350" y="108" text-anchor="middle" font-size="12" fill="#333" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">网卡控制器按单机配</tspan></text> <text x="350" y="132" text-anchor="middle" font-size="12" fill="#333" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">吞吐不够就是不够</tspan></text> <rect x="470" y="50" width="200" height="26" rx="4" fill="#764ba2" style="visibility: visible;"></rect><text x="570" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">可靠性墙</tspan></text> <rect x="470" y="76" width="200" height="84" rx="4" fill="#f8f9fa" stroke="#dee2e6" style="visibility: visible;"></rect><text x="570" y="108" text-anchor="middle" font-size="12" fill="#333" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">机器一坏数据全丢</tspan></text> <text x="570" y="132" text-anchor="middle" font-size="12" fill="#333" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">部件越多故障越多</tspan></text> <text x="350" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#16213e"><tspan leaf="">想同时突破三面墙，只有一条路：把很多台机器组织起来用</tspan></text> <text x="350" y="234" text-anchor="middle" font-size="12" fill="#555"><tspan leaf="">这就是分布式存储的由来</tspan></text></svg>