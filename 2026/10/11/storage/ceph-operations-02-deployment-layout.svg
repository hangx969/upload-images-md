<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">一个典型的 Ceph 部署</tspan></text> <rect x="30" y="42" width="640" height="60" rx="6" fill="#f0f4ff" stroke="#4A6CF7"></rect><text x="45" y="65" font-size="12" font-weight="bold" fill="#16213e"><tspan leaf="">public 网（客户端流量）：起步 10GbE，全闪建议 25GbE</tspan></text> <rect x="60" y="74" width="110" height="20" rx="3" fill="#16213e"></rect><text x="115" y="88" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">虚拟机客户端</tspan></text> <rect x="190" y="74" width="110" height="20" rx="3" fill="#16213e"></rect><text x="245" y="88" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">应用（S3）</tspan></text> <rect x="320" y="74" width="110" height="20" rx="3" fill="#16213e"></rect><text x="375" y="88" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">文件挂载</tspan></text> <rect x="30" y="118" width="640" height="44" rx="6" fill="#fef5f5" stroke="#e94560"></rect><text x="45" y="137" font-size="12" font-weight="bold" fill="#16213e"><tspan leaf="">cluster 网（副本与恢复流量）：三副本写一份传三份，带宽决定写入上限</tspan></text> <text x="45" y="153" font-size="11" fill="#555"><tspan leaf="">两张网物理或 VLAN 隔离</tspan></text> <rect x="30" y="178" width="200" height="150" rx="6" fill="#fff" stroke="#dee2e6"></rect><rect x="30" y="178" width="200" height="26" rx="6" fill="#667eea"></rect><text x="130" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">管理节点 ×3</tspan></text> <text x="45" y="222" font-size="11" fill="#333"><tspan leaf="">MON ×3 + MGR ×2</tspan></text> <text x="45" y="244" font-size="11" fill="#333"><tspan leaf="">小容量独立盘</tspan></text> <text x="45" y="266" font-size="11" fill="#333"><tspan leaf="">NTP 时钟同步</tspan></text> <text x="45" y="288" font-size="11" fill="#555"><tspan leaf="">不混重 IO 业务</tspan></text> <rect x="250" y="178" width="200" height="150" rx="6" fill="#fff" stroke="#dee2e6"></rect><rect x="250" y="178" width="200" height="26" rx="6" fill="#0f3460"></rect><text x="350" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">存储节点 ×N（每台多盘）</tspan></text> <rect x="265" y="215" width="26" height="60" rx="2" fill="#0f3460"></rect><rect x="297" y="215" width="26" height="60" rx="2" fill="#0f3460"></rect><rect x="329" y="215" width="26" height="60" rx="2" fill="#0f3460"></rect><rect x="361" y="215" width="26" height="60" rx="2" fill="#0f3460"></rect><rect x="393" y="215" width="26" height="60" rx="2" fill="#0f3460"></rect><text x="350" y="298" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">一块盘一个 OSD，OSD 数量最多</tspan></text> <rect x="470" y="178" width="200" height="150" rx="6" fill="#fff" stroke="#dee2e6"></rect><rect x="470" y="178" width="200" height="26" rx="6" fill="#27ae60"></rect><text x="570" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">网关 / 接入节点</tspan></text> <text x="485" y="222" font-size="11" fill="#333"><tspan leaf="">RGW：S3 接口，前置负载均衡</tspan></text> <text x="485" y="244" font-size="11" fill="#333"><tspan leaf="">MDS：仅 CephFS 需要</tspan></text> <text x="485" y="266" font-size="11" fill="#333"><tspan leaf="">监控：Prometheus + Grafana</tspan></text> <text x="485" y="288" font-size="11" fill="#555"><tspan leaf="">小规模可与存储节点混部</tspan></text> <text x="350" y="356" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">容量三条水位线：85% 告警，90% 停止再平衡，95% 拒绝写入</tspan></text> <text x="350" y="378" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">部署走 cephadm 或 Rook，不要手工攒</tspan></text></svg>