<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">数据放在哪：三类答案</tspan></text> <rect x="15" y="42" width="210" height="30" rx="4" fill="#667eea"></rect><text x="120" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff"><tspan leaf="">一，建一张表</tspan></text> <rect x="15" y="72" width="210" height="200" rx="4" fill="#f8f9fa" stroke="#dee2e6"></rect><rect x="35" y="92" width="60" height="24" rx="3" fill="#16213e"></rect><text x="65" y="108" text-anchor="middle" font-size="11" fill="#fff"><tspan leaf="">客户端</tspan></text> <line x1="95" y1="104" x2="125" y2="104" stroke="#999" stroke-width="1.5"></line><polygon points="125,100 133,104 125,108" fill="#999"></polygon><rect x="135" y="92" width="70" height="24" rx="3" fill="#e94560"></rect><text x="170" y="108" text-anchor="middle" font-size="11" fill="#fff"><tspan leaf="">放置表</tspan></text> <text x="120" y="140" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">代表：HDFS NameNode</tspan></text> <text x="120" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60"><tspan leaf="">优点：直观，可控</tspan></text> <text x="120" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#e94560"><tspan leaf="">代价：表是中心</tspan></text> <text x="120" y="212" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">内存随数据量涨</tspan></text> <text x="120" y="232" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">可用性决定全局</tspan></text> <rect x="245" y="42" width="210" height="30" rx="4" fill="#764ba2"></rect><text x="350" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff"><tspan leaf="">二，一致性哈希</tspan></text> <rect x="245" y="72" width="210" height="200" rx="4" fill="#f8f9fa" stroke="#dee2e6"></rect><circle cx="350" cy="108" r="18" fill="none" stroke="#764ba2" stroke-width="2"></circle><circle cx="350" cy="90" r="3" fill="#764ba2"></circle><circle cx="368" cy="108" r="3" fill="#764ba2"></circle><circle cx="350" cy="126" r="3" fill="#764ba2"></circle><circle cx="332" cy="108" r="3" fill="#764ba2"></circle><text x="350" y="148" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">节点和数据哈希到同一个环</tspan></text> <text x="350" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60"><tspan leaf="">优点：无中心，迁移量小</tspan></text> <text x="350" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#e94560"><tspan leaf="">代价：环是平的</tspan></text> <text x="350" y="212" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">机架层级表达不出来</tspan></text> <text x="350" y="232" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">故障域靠补丁控制</tspan></text> <rect x="475" y="42" width="210" height="30" rx="4" fill="#0f3460"></rect><text x="580" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff"><tspan leaf="">三，算法计算</tspan></text> <rect x="475" y="72" width="210" height="200" rx="4" fill="#f8f9fa" stroke="#dee2e6"></rect><rect x="495" y="92" width="80" height="24" rx="3" fill="#16213e"></rect><text x="535" y="108" text-anchor="middle" font-size="11" fill="#fff"><tspan leaf="">集群地图</tspan></text> <line x1="575" y1="104" x2="605" y2="104" stroke="#999" stroke-width="1.5"></line><polygon points="605,100 613,104 605,108" fill="#999"></polygon><rect x="615" y="92" width="50" height="24" rx="3" fill="#27ae60"></rect><text x="640" y="108" text-anchor="middle" font-size="11" fill="#fff"><tspan leaf="">计算</tspan></text> <text x="580" y="140" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">代表：Ceph 的 CRUSH</tspan></text> <text x="580" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60"><tspan leaf="">优点：无中心，无查表</tspan></text> <text x="580" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60"><tspan leaf="">层级和规则天然支持</tspan></text> <text x="580" y="212" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">代价：行为不透明</tspan></text> <text x="580" y="232" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">手动干预放置比较难</tspan></text> <text x="350" y="298" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">Ceph 用第三种：客户端和 OSD 各拿一份地图，各算各的，答案一致</tspan></text></svg>