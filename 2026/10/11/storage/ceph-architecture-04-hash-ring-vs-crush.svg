<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">一致性哈希与 CRUSH 的分野</tspan></text> <rect x="20" y="42" width="310" height="210" rx="6" fill="#fff" stroke="#dee2e6"></rect><text x="175" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#764ba2"><tspan leaf="">一致性哈希：一个平的环</tspan></text> <circle cx="110" cy="150" r="62" fill="none" stroke="#764ba2" stroke-width="2"></circle><circle cx="110" cy="88" r="6" fill="#16213e"></circle><circle cx="172" cy="150" r="6" fill="#16213e"></circle><circle cx="110" cy="212" r="6" fill="#16213e"></circle><circle cx="48" cy="150" r="6" fill="#16213e"></circle><circle cx="154" cy="106" r="5" fill="#e94560"></circle><line x1="154" y1="106" x2="168" y2="122" stroke="#e94560" stroke-width="1.5"></line><polygon points="168,118 173,124 165,124" fill="#e94560"></polygon><text x="110" y="152" text-anchor="middle" font-size="10" fill="#555"><tspan leaf="">数据</tspan></text> <text x="240" y="120" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">节点、数据同环</tspan></text> <text x="240" y="140" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">数据找最近的节点</tspan></text> <text x="240" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#e94560"><tspan leaf="">环上没有层级</tspan></text> <text x="240" y="188" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">故障域控制靠</tspan></text> <text x="240" y="204" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">虚拟节点打补丁</tspan></text> <rect x="370" y="42" width="310" height="210" rx="6" fill="#fff" stroke="#dee2e6"></rect><text x="525" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f3460"><tspan leaf="">CRUSH：一棵带规则的树</tspan></text> <rect x="490" y="80" width="70" height="22" rx="3" fill="#0f3460"></rect><text x="525" y="95" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">root</tspan></text> <line x1="505" y1="102" x2="455" y2="122" stroke="#999" stroke-width="1.5"></line><line x1="545" y1="102" x2="595" y2="122" stroke="#999" stroke-width="1.5"></line><rect x="420" y="122" width="70" height="22" rx="3" fill="#667eea"></rect><text x="455" y="137" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">机架 A</tspan></text> <rect x="560" y="122" width="70" height="22" rx="3" fill="#667eea"></rect><text x="595" y="137" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">机架 B</tspan></text> <circle cx="435" cy="168" r="6" fill="#27ae60"></circle><circle cx="455" cy="168" r="6" fill="#27ae60"></circle><circle cx="475" cy="168" r="6" fill="#27ae60"></circle><circle cx="575" cy="168" r="6" fill="#27ae60"></circle><circle cx="595" cy="168" r="6" fill="#27ae60"></circle><circle cx="615" cy="168" r="6" fill="#27ae60"></circle><text x="525" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60"><tspan leaf="">规则写明打散到哪一层</tspan></text> <text x="525" y="218" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">同机架只放一份，树结构直接表达</tspan></text> <text x="525" y="238" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">权重按容量分配数据比例</tspan></text> <text x="350" y="280" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">两者迁移量都小，差别在层级表达和故障域控制</tspan></text></svg>