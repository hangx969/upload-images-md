<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">一套底座，三种形态</tspan></text> <rect x="20" y="42" width="210" height="130" rx="6" fill="#fff" stroke="#27ae60"></rect><rect x="20" y="42" width="210" height="30" rx="6" fill="#27ae60"></rect><text x="125" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff"><tspan leaf="">RBD 块</tspan></text> <text x="35" y="95" font-size="11" fill="#333"><tspan leaf="">接口：内核模块 / QEMU</tspan></text> <text x="35" y="115" font-size="11" fill="#333"><tspan leaf="">镜像切成 4MB 对象</tspan></text> <text x="35" y="135" font-size="11" fill="#333"><tspan leaf="">快照与克隆：写时复制</tspan></text> <text x="35" y="158" font-size="11" fill="#555"><tspan leaf="">用在哪：虚拟机磁盘、数据库</tspan></text> <rect x="245" y="42" width="210" height="130" rx="6" fill="#fff" stroke="#e94560"></rect><rect x="245" y="42" width="210" height="30" rx="6" fill="#e94560"></rect><text x="350" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff"><tspan leaf="">RGW 对象</tspan></text> <text x="260" y="95" font-size="11" fill="#333"><tspan leaf="">接口：HTTP，S3 兼容</tspan></text> <text x="260" y="115" font-size="11" fill="#333"><tspan leaf="">桶与元数据也在 RADOS</tspan></text> <text x="260" y="135" font-size="11" fill="#333"><tspan leaf="">大文件分片，多站点同步</tspan></text> <text x="260" y="158" font-size="11" fill="#555"><tspan leaf="">用在哪：备份、图片、数据湖</tspan></text> <rect x="470" y="42" width="210" height="130" rx="6" fill="#fff" stroke="#764ba2"></rect><rect x="470" y="42" width="210" height="30" rx="6" fill="#764ba2"></rect><text x="575" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff"><tspan leaf="">CephFS 文件</tspan></text> <text x="485" y="95" font-size="11" fill="#333"><tspan leaf="">接口：POSIX 挂载、NFS</tspan></text> <text x="485" y="115" font-size="11" fill="#333"><tspan leaf="">MDS 管目录树和 inode</tspan></text> <text x="485" y="135" font-size="11" fill="#333"><tspan leaf="">多客户端同时挂载</tspan></text> <text x="485" y="158" font-size="11" fill="#555"><tspan leaf="">用在哪：共享数据集、家目录</tspan></text> <line x1="125" y1="172" x2="125" y2="200" stroke="#999" stroke-width="1.5"></line><polygon points="121,200 125,208 129,200" fill="#999"></polygon><line x1="350" y1="172" x2="350" y2="200" stroke="#999" stroke-width="1.5"></line><polygon points="346,200 350,208 354,200" fill="#999"></polygon><line x1="575" y1="172" x2="575" y2="200" stroke="#999" stroke-width="1.5"></line><polygon points="571,200 575,208 579,200" fill="#999"></polygon><rect x="20" y="210" width="660" height="40" rx="6" fill="#667eea"></rect><text x="350" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff"><tspan leaf="">RADOS 对象层 + CRUSH 放置 + 池（pool）冗余策略</tspan></text> <line x1="350" y1="250" x2="350" y2="272" stroke="#999" stroke-width="1.5"></line><polygon points="346,272 350,280 354,272" fill="#999"></polygon><rect x="20" y="282" width="660" height="44" rx="6" fill="#0f3460"></rect><text x="350" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">MON · MGR · OSD（· MDS，仅文件形态需要）</tspan></text> <text x="350" y="318" text-anchor="middle" font-size="11" fill="#fff"><tspan leaf="">同一批物理服务器，同一套盘</tspan></text> <text x="350" y="352" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">三种形态可以分池隔离，也可以共用一个池；IO 会互相竞争，下篇算账</tspan></text></svg>