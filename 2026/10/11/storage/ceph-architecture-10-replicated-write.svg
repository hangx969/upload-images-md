<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">一次写入的完整路径</tspan></text> <rect x="30" y="50" width="150" height="46" rx="4" fill="#16213e"></rect><text x="105" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">客户端</tspan></text> <rect x="270" y="50" width="180" height="46" rx="4" fill="#27ae60"></rect><text x="360" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">主 OSD（osd.7）</tspan></text> <text x="360" y="86" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">定序，转发，落盘</tspan></text> <rect x="530" y="42" width="150" height="30" rx="4" fill="#0f3460"></rect><text x="605" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">副本 OSD（osd.2）</tspan></text> <rect x="530" y="80" width="150" height="30" rx="4" fill="#0f3460"></rect><text x="605" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">副本 OSD（osd.9）</tspan></text> <line x1="180" y1="73" x2="268" y2="73" stroke="#999" stroke-width="1.5"></line><polygon points="268,69 276,73 268,77" fill="#999"></polygon><text x="224" y="62" text-anchor="middle" font-size="10" fill="#555"><tspan leaf="">2. 直发</tspan></text> <line x1="450" y1="60" x2="528" y2="58" stroke="#999" stroke-width="1.5"></line><polygon points="528,54 536,58 528,62" fill="#999"></polygon><line x1="450" y1="85" x2="528" y2="92" stroke="#999" stroke-width="1.5"></line><polygon points="528,88 536,92 528,96" fill="#999"></polygon><text x="490" y="125" text-anchor="middle" font-size="10" fill="#555"><tspan leaf="">3. 转发并各自落盘</tspan></text> <rect x="30" y="160" width="650" height="120" rx="6" fill="#f0f4ff" stroke="#4A6CF7"></rect><text x="45" y="185" font-size="12" font-weight="bold" fill="#16213e"><tspan leaf="">流程要点</tspan></text> <text x="45" y="208" font-size="11" fill="#333"><tspan leaf="">1. 客户端用 CRUSH 算出 PG 和主 OSD，不需要任何人指路</tspan></text> <text x="45" y="228" font-size="11" fill="#333"><tspan leaf="">4. 副本全部确认后，主 OSD 才回复客户端；收到成功，数据已在所有副本</tspan></text> <text x="45" y="248" font-size="11" fill="#333"><tspan leaf="">5. 中途副本失联：MON 更新地图，PG 重新选主、核对日志、补齐差异</tspan></text> <text x="45" y="268" font-size="11" fill="#555"><tspan leaf="">MON 全程不经手数据，只发地图</tspan></text> <text x="350" y="315" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">PG 内强一致：读写都经主 OSD 定序，客户端不会读到旧值</tspan></text></svg>