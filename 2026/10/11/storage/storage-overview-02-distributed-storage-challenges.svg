<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">分布带来的四道题</tspan></text> <rect x="30" y="45" width="300" height="28" rx="4" fill="#667eea"></rect><text x="180" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff"><tspan leaf="">数据放在哪</tspan></text> <rect x="30" y="73" width="300" height="62" rx="4" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="180" y="98" text-anchor="middle" font-size="12" fill="#333"><tspan leaf="">写入时选哪台机器</tspan></text> <text x="180" y="120" text-anchor="middle" font-size="12" fill="#555"><tspan leaf="">哈希、范围、一致性哈希、CRUSH</tspan></text> <rect x="370" y="45" width="300" height="28" rx="4" fill="#764ba2"></rect><text x="520" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff"><tspan leaf="">数据怎么不丢</tspan></text> <rect x="370" y="73" width="300" height="62" rx="4" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="520" y="98" text-anchor="middle" font-size="12" fill="#333"><tspan leaf="">冗余策略</tspan></text> <text x="520" y="120" text-anchor="middle" font-size="12" fill="#555"><tspan leaf="">多副本还是纠删码</tspan></text> <rect x="30" y="150" width="300" height="28" rx="4" fill="#27ae60"></rect><text x="180" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff"><tspan leaf="">多份视图怎么一致</tspan></text> <rect x="30" y="178" width="300" height="62" rx="4" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="180" y="203" text-anchor="middle" font-size="12" fill="#333"><tspan leaf="">一致性模型</tspan></text> <text x="180" y="225" text-anchor="middle" font-size="12" fill="#555"><tspan leaf="">强一致、弱一致、最终一致</tspan></text> <rect x="370" y="150" width="300" height="28" rx="4" fill="#e94560"></rect><text x="520" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff"><tspan leaf="">机器坏了怎么办</tspan></text> <rect x="370" y="178" width="300" height="62" rx="4" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="520" y="203" text-anchor="middle" font-size="12" fill="#333"><tspan leaf="">故障检测、数据重建、切换</tspan></text> <text x="520" y="225" text-anchor="middle" font-size="12" fill="#555"><tspan leaf="">规模越大，坏机器越是常态</tspan></text> <text x="350" y="260" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">项目之间的差异，基本就是这四道题的答案差异</tspan></text></svg>