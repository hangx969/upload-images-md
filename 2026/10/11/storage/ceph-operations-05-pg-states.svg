<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">PG 的几个关键状态</tspan></text> <rect x="40" y="55" width="150" height="50" rx="4" fill="#27ae60"></rect><text x="115" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">active+clean</tspan></text> <text x="115" y="94" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">副本齐全，正常</tspan></text> <rect x="40" y="145" width="150" height="50" rx="4" fill="#e94560"></rect><text x="115" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">degraded</tspan></text> <text x="115" y="184" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">副本不够，服务可用</tspan></text> <rect x="275" y="145" width="150" height="50" rx="4" fill="#667eea"></rect><text x="350" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">recovering / backfilling</tspan></text> <text x="350" y="184" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">重建进行中</tspan></text> <rect x="510" y="145" width="150" height="50" rx="4" fill="#764ba2"></rect><text x="585" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">undersized</tspan></text> <text x="585" y="184" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">低于最小副本，写暂停</tspan></text> <rect x="275" y="55" width="150" height="50" rx="4" fill="#0f3460"></rect><text x="350" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">peering</tspan></text> <text x="350" y="94" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">副本间核对版本</tspan></text> <line x1="190" y1="80" x2="273" y2="80" stroke="#999" stroke-width="1.5"></line><polygon points="273,76 281,80 273,84" fill="#999"></polygon><line x1="115" y1="105" x2="115" y2="143" stroke="#999" stroke-width="1.5"></line><polygon points="111,143 115,151 119,143" fill="#999"></polygon><line x1="190" y1="170" x2="273" y2="170" stroke="#999" stroke-width="1.5"></line><polygon points="273,166 281,170 273,174" fill="#999"></polygon><line x1="425" y1="170" x2="508" y2="170" stroke="#999" stroke-width="1.5"></line><polygon points="508,166 516,170 508,174" fill="#999"></polygon><line x1="350" y1="145" x2="350" y2="107" stroke="#999" stroke-width="1.5"></line><polygon points="346,107 350,99 354,107" fill="#999"></polygon><text x="350" y="230" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">数据完整性另有定期 scrub（副本比对）与 deep scrub（全量校验和）</tspan></text> <text x="350" y="250" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">默认每天 scrub 一次，每周 deep scrub 一次，静默损坏在这里被揪出来</tspan></text> <text x="350" y="275" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">长时间不回 active+clean，是人工介入的信号</tspan></text></svg>