<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">Ceph 的二十年</tspan></text> <line x1="40" y1="175" x2="660" y2="175" stroke="#999" stroke-width="2"></line><circle cx="50" cy="175" r="5" fill="#764ba2"></circle><circle cx="150" cy="175" r="5" fill="#764ba2"></circle><circle cx="250" cy="175" r="5" fill="#0f3460"></circle><circle cx="350" cy="175" r="5" fill="#0f3460"></circle><circle cx="450" cy="175" r="5" fill="#27ae60"></circle><circle cx="550" cy="175" r="5" fill="#0f3460"></circle><circle cx="650" cy="175" r="5" fill="#667eea"></circle><text x="50" y="95" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">2004</tspan></text> <text x="50" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#764ba2"><tspan leaf="">项目开始</tspan></text> <text x="50" y="133" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">Weil 在 UCSC 写代码</tspan></text> <text x="250" y="95" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">2012</tspan></text> <text x="250" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f3460"><tspan leaf="">Inktank 成立</tspan></text> <text x="250" y="133" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">首个稳定版 Argonaut</tspan></text> <text x="450" y="95" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">2018</tspan></text> <text x="450" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60"><tspan leaf="">Ceph 基金会</tspan></text> <text x="450" y="133" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">进入 Linux 基金会</tspan></text> <text x="650" y="95" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">2025</tspan></text> <text x="650" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#667eea"><tspan leaf="">Tentacle v20</tspan></text> <text x="650" y="133" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">第 20 个稳定版</tspan></text> <text x="150" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#764ba2"><tspan leaf="">两篇论文</tspan></text> <text x="150" y="223" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">OSDI 讲文件系统，SC 讲 CRUSH</tspan></text> <text x="150" y="241" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">2006</tspan></text> <text x="350" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f3460"><tspan leaf="">Red Hat 收购</tspan></text> <text x="350" y="223" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">约 1.75 亿美元买下 Inktank</tspan></text> <text x="350" y="241" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">2014</tspan></text> <text x="550" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f3460"><tspan leaf="">IBM 整合</tspan></text> <text x="550" y="223" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">商业版并入 IBM Storage</tspan></text> <text x="550" y="241" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">2022</tspan></text> <text x="350" y="285" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">紫=学术阶段 · 蓝=商业阶段 · 绿=基金会治理</tspan></text> <text x="350" y="305" text-anchor="middle" font-size="11" fill="#888"><tspan leaf="">2007 年 Weil 完成博士论文，2017 年 BlueStore 成为默认引擎，下一篇细讲</tspan></text></svg>